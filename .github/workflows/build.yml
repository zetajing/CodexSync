name: build

on:
  push:
    branches:
      - master
      - feature/wpf-mvp
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\CodexSync.sln
      - name: Build
        run: dotnet build .\CodexSync.sln --configuration Release --no-restore
